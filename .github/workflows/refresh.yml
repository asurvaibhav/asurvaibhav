name: refresh stats
on:
  schedule:
    - cron: "17 5 * * *"  # Runs daily at 05:17 UTC
  workflow_dispatch:      # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pillow numpy opencv-python-headless rembg onnxruntime

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate_portrait.py
          python3 scripts/generate_stats.py

      - name: Commit and push changes
        run: |
          FILES="portrait.svg stats.svg"
          [ -z "$(git status --porcelain -- $FILES)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES && git commit -m "stats: refresh graphics" && git push
